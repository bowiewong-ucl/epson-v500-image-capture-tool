name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build app
        run: pyinstaller packaging/v500capture.spec --noconfirm

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item dist/V500Capture.exe, packaging/install-windows.ps1 release/

      - uses: actions/upload-artifact@v4
        with:
          name: V500Capture-windows-x64
          path: release/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: V500Capture-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            V500Capture.exe
            install-windows.ps1
