name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: V500Capture-windows-x64
          - os: macos-14          # Apple Silicon
            artifact: V500Capture-macos-arm64
          - os: macos-15-intel    # Intel Macs
            artifact: V500Capture-macos-intel
          - os: ubuntu-22.04      # older glibc, so the build also runs on newer Ubuntu
            artifact: V500Capture-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 \
            libxcb-image0 libdbus-1-3

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build app
        run: pyinstaller packaging/v500capture.spec --noconfirm

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/V500Capture.exe "${{ matrix.artifact }}.exe"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/V500 Capture.app" "${{ matrix.artifact }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg/V500Capture
          cp dist/V500Capture scripts/linux/setup-epson-v500.sh pkg/V500Capture/
          tar -czf "${{ matrix.artifact }}.tar.gz" -C pkg V500Capture

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: V500Capture-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: V500Capture-*
